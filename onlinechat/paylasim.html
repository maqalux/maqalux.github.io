<script>
(() => {
"use strict";

/*
  İKİMİZ — MOBİL YENİLƏMƏ V2

  Əvvəlki tam paylasim.html kodundan SONRA,
  </body> sətrindən ƏVVƏL yerləşdirilir.

  Əvvəlki ZIP generatoru, şifrələmə və format
  dəyişdirmə funksiyaları saxlanılır.
*/

if (
  typeof ZipStream === "undefined" ||
  typeof makeCipher !== "function"
) {
  alert(
    "Mobil yeniləmə əvvəlki paylasim.html kodundan sonra yerləşdirilməlidir."
  );
  return;
}

const MAX_RAM = 200 * 1024 * 1024;

let current = null;
let booting = false;

const live = s => current === s && !s.closed;

const valid = (s, c) =>
  live(s) && s.c === c && !c.closed;

const failText = e =>
  e.name === "QuotaExceededError"
    ? "Telefonun brauzer üçün ayırdığı yaddaş doldu. Qəbul tamamlanmadı."
    : (e.message || String(e));

/* Hazır ZIP-lər üçün ayrıca sahə. */
const output = document.createElement("section");
output.style.cssText = "padding:0 20px 20px";
$("sessionArea").after(output);

/* Köhnə kompüter tövsiyəsini mobil məlumatla əvəz et. */
const note = document.querySelector(
  "#receivePanel > .notice:last-child"
);

if (note && note.id !== "offer") {
  note.replaceChildren();

  const title = document.createElement("strong");
  title.textContent = "Telefonda qəbul üçün uyğunlaşdırılıb";

  const p = document.createElement("p");
  p.textContent =
    "Dəstəklənən brauzerlərdə ZIP hissə-hissə telefonun yerli " +
    "yaddaşına yazılır. Sonra “ZIP-i yüklə” düyməsi ilə saxlanılır. " +
    "Hədd boş yer və brauzerin ayırdığı yaddaşdan asılıdır.";

  note.append(title, p);
}

const versionInfo = document.createElement("p");
versionInfo.className = "muted";
versionInfo.textContent =
  "Mobil yeniləmə v2 · Bağlantı bərpası · Yerli ZIP saxlaması";

$("sendPanel").prepend(versionInfo);

/* Köhnə mətnlərdəki uyğunsuz məlumatları yenilə. */
const privacy = document.querySelector("details");

if (privacy) {
  for (const paragraph of privacy.querySelectorAll("p")) {
    if (paragraph.textContent.includes("TURN vasitəçi")) {
      paragraph.textContent =
        "Birbaşa bağlantıya əlavə olaraq ictimai TURN xidməti " +
        "istifadə edilir. Əlavə tətbiq şifrələməsi saxlanır. " +
        "Provayderin əlçatanlığı zəmanətli deyil və internet " +
        "trafiki sərf olunur.";
    }

    if (paragraph.textContent.includes("Yarımçıq göndəriş")) {
      paragraph.textContent =
        "1 saat / 24 saat açıq sessiyanın maksimum müddətidir. " +
        "Qısa bağlantı kəsilmələrində eyni açıq səhifədə qəbul " +
        "edilən hissədən davam etmək sınanır. Səhifənin yenilənməsi " +
        "və ya brauzerin telefon tərəfindən tam bağlanması bu " +
        "bərpanı dayandırır.";
    }
  }

  const paragraph = document.createElement("p");

  paragraph.textContent =
    "Mobil v2: birbaşa əlaqə alınmayanda Open Relay-in ictimai TURN " +
    "xidməti şifrəli trafiki ötürməyə çalışır. Bu xidmətin " +
    "əlçatanlığı və pulsuz resursları zəmanətli deyil. Alıcıda " +
    "müvəqqəti ZIP brauzerin bu sayt üçün yerli fayl sahəsində " +
    "şifrəsiz saxlanır. Yüklədikdən sonra həmin nüsxəni ayrıca " +
    "silə bilərsən. Bərpa yalnız eyni açıq səhifə daxilindədir; " +
    "telefon brauzeri tam bağlayarsa ötürmə davam etməyə bilər.";

  privacy.append(paragraph);
}

/* ======================================================
   STUN + İCTİMAİ TURN
   ====================================================== */

async function iceServers() {
  /*
    Buradakı secret şəxsi API açarı deyil.
    Open Relay provayderinin açıq sənədləşdirdiyi
    static-auth məlumatıdır.

    Özəl TURN serverinin məxfi açarını HTML-də saxlamaq olmaz.
  */

  const username =
    Math.floor(Date.now() / 1000 + 90000) +
    ":" +
    randomId(8);

  const key = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode("openrelayprojectsecret"),
    {
      name: "HMAC",
      hash: "SHA-1"
    },
    false,
    ["sign"]
  );

  const signature = new Uint8Array(
    await crypto.subtle.sign(
      "HMAC",
      key,
      new TextEncoder().encode(username)
    )
  );

  const credential = btoa(
    String.fromCharCode(...signature)
  );

  return [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun.cloudflare.com:3478"
    },
    {
      urls: [
        "turn:staticauth.openrelay.metered.ca:80?transport=udp",
        "turn:staticauth.openrelay.metered.ca:443?transport=tcp",
        "turns:staticauth.openrelay.metered.ca:443?transport=tcp"
      ],
      username,
      credential
    }
  ];
}

/* ======================================================
   ÜMUMİ VƏZİYYƏT VƏ TƏMİZLƏMƏ
   ====================================================== */

function status(s, text) {
  if (live(s) && !s.completed) {
    setStatus(text);
  }
}

async function wake(s) {
  if (
    !live(s) ||
    document.hidden ||
    (s.wake && !s.wake.released)
  ) {
    return;
  }

  try {
    s.wake = await navigator.wakeLock?.request("screen");
  } catch {}
}

function detach(s, c) {
  if (!c || c.closed) return;

  c.closed = true;
  c.abort.abort();

  clearTimeout(c.timer);

  if (s.c === c) {
    s.c = null;
  }

  try {
    c.conn.close();
  } catch {}
}

function retry(s, c) {
  if (!live(s)) return;
  if (c && s.c !== c) return;

  detach(s, c);

  s.retryAt =
    Date.now() +
    Math.min(
      15000,
      1500 * 2 ** Math.min(s.tries++, 4)
    );

  $("verifyArea").hidden = true;
  $("approve").hidden = true;
  $("saveZip").disabled = true;

  status(
    s,
    s.sender
      ? "Otaq açıqdır. Alıcı ilə bağlantı yenidən gözlənilir…"
      : "Əlaqə bərpa olunur. Link və qəbul edilən hissə saxlanılıb…"
  );
}

async function shutdown(s) {
  if (!s || s.closed) return;

  s.closed = true;

  clearInterval(s.watch);
  clearTimeout(s.finishTimer);

  detach(s, s.c);

  try {
    s.peer?.destroy();
  } catch {}

  try {
    await s.wake?.release();
  } catch {}

  await s.io.catch(() => {});

  if (!s.completed && s.sink) {
    try {
      await s.sink.writer?.abort();
    } catch {}

    try {
      await s.sink.dir?.removeEntry(s.sink.name);
    } catch {}

    s.sink.parts = [];
  }

  if (current === s) {
    current = null;
    session = null;

    setBusy(false);

    $("shareArea").hidden = true;
    $("verifyArea").hidden = true;
    $("offer").hidden = true;
    $("endSession").hidden = true;
  }
}

/*
  Əvvəlki kodun pagehide callback-i də yeni
  təmizləmə funksiyasını istifadə etsin.
*/
closeSession = shutdown;

function fatal(s, error) {
  if (!live(s)) return;

  setStatus(
    s.completed ? "ZIP hazırdır." : "Ötürmə dayandı"
  );

  showError(new Error(failText(error)));

  void shutdown(s);
}

function temporary(message) {
  const error = new Error(message);
  error.transient = true;
  return error;
}

function permanent(message) {
  const error = new Error(message);
  error.permanent = true;
  return error;
}

function mobileProgress(s, bytes) {
  updateProgress(s, bytes);

  const seconds = (Date.now() - s.started) / 1000;

  $("speedText").textContent =
    seconds > 1
      ? formatSize(
          Math.max(
            0,
            bytes - (s.startOffset || 0)
          ) / seconds
        ) + "/san"
      : "";
}

/* ======================================================
   ŞİFRƏLİ PAKET GÖNDƏRMƏ
   ====================================================== */

function send(s, c, type, value) {
  const job = c.out.then(async () => {
    if (!valid(s, c)) {
      throw temporary("Bağlantı dəyişdi.");
    }

    const packet = await c.cipher.seal(type, value);

    if (!valid(s, c) || !c.conn.open) {
      throw temporary("Bağlantı kəsildi.");
    }

    try {
      c.conn.send(packet);
    } catch {
      throw temporary("Bağlantı kəsildi.");
    }
  });

  c.out = job.catch(() => {});

  return job;
}

const control = (s, c, message) =>
  send(s, c, 0, message);

/* ======================================================
   PEER OTAĞININ QORUNMASI VƏ YENİDƏN QOŞULMA
   ====================================================== */

function setupPeer(s) {
  if (!live(s)) return;
  if (s.c?.conn.open) return;

  const old = s.peer;
  s.peer = null;

  try {
    old?.destroy();
  } catch {}

  const peer = new Peer(s.peerId, {
    debug: 0,
    secure: true,
    config: {
      iceServers: s.ice,
      iceTransportPolicy: "all"
    }
  });

  s.peer = peer;
  s.peerStarted = Date.now();
  s.signalRetryAt = Date.now() + 15000;

  const same = () =>
    live(s) && s.peer === peer;

  peer.on("open", () => {
    if (!same()) return;

    if (s.sender) {
      const url = new URL(location.href);

      url.searchParams.set("mobile", "2");

      url.hash = new URLSearchParams({
        room: s.room,
        key: s.secret,
        v: "2"
      }).toString();

      $("shareLink").value = url.href;
      $("shareArea").hidden = false;

      status(
        s,
        "Link hazırdır. Otaq alıcı üçün açıq saxlanılır."
      );
    } else {
      dial(s);
    }
  });

  peer.on("connection", connection => {
    if (
      !same() ||
      !s.sender ||
      s.c ||
      (
        s.receiver &&
        s.receiver !== connection.peer
      )
    ) {
      connection.close();
      return;
    }

    const nonce = connection.metadata?.mobileNonce;

    if (
      !/^[A-Za-z0-9_-]{22}$/.test(nonce || "") ||
      s.seen.has(nonce)
    ) {
      connection.close();
      return;
    }

    s.seen.add(nonce);

    attach(s, connection, nonce);
  });

  peer.on("disconnected", () => {
    if (same()) {
      s.signalRetryAt = Date.now() + 1000;
    }
  });

  peer.on("error", error => {
    if (!same()) return;

    if (
      [
        "browser-incompatible",
        "invalid-id",
        "invalid-key"
      ].includes(error.type)
    ) {
      fatal(
        s,
        new Error(
          "Bağlantı bu brauzerdə açıla bilmədi: " +
          error.type
        )
      );
      return;
    }

    /*
      peer-unavailable, network və oxşar müvəqqəti
      xətalar otağı silmir.
    */
    if (!s.c?.conn.open) {
      retry(s, s.c);
    }

    s.signalRetryAt = Date.now() + 3000;
  });
}

function dial(s) {
  if (
    !live(s) ||
    s.sender ||
    s.c ||
    !s.peer?.open ||
    s.peer.disconnected ||
    Date.now() < s.retryAt ||
    navigator.onLine === false
  ) {
    return;
  }

  const nonce = randomId();

  const connection = s.peer.connect(s.room, {
    reliable: true,
    serialization: "raw",
    metadata: {
      mobileNonce: nonce
    }
  });

  attach(s, connection, nonce);
}

function tick(s) {
  if (!live(s)) return;

  if (Date.now() >= s.expires) {
    fatal(
      s,
      new Error("Paylaşım müddəti bitdi.")
    );
    return;
  }

  $("expiry").textContent =
    "Qalan müddət: " +
    Math.ceil(
      (s.expires - Date.now()) / 60000
    ) +
    " dəqiqə.";

  if (
    document.hidden ||
    navigator.onLine === false
  ) {
    return;
  }

  const peer = s.peer;

  if (
    (!peer || peer.destroyed) &&
    Date.now() >= s.signalRetryAt
  ) {
    retry(s, s.c);
    setupPeer(s);

  } else if (
    peer?.disconnected &&
    Date.now() >= s.signalRetryAt
  ) {
    s.signalRetryAt = Date.now() + 15000;

    try {
      peer.reconnect();
    } catch {
      if (!s.c?.conn.open) {
        setupPeer(s);
      }
    }

  } else if (
    peer &&
    !peer.open &&
    Date.now() - s.peerStarted > 30000 &&
    Date.now() >= s.signalRetryAt &&
    !s.c?.conn.open
  ) {
    setupPeer(s);
  }

  if (
    s.c &&
    [
      "sending",
      "receiving",
      "ending"
    ].includes(s.c.phase) &&
    Date.now() - s.c.last > 90000
  ) {
    retry(s, s.c);
  }

  if (!s.sender && !s.c) {
    dial(s);
  }
}

/* ======================================================
   YENİ SESSİYA
   ====================================================== */

async function start(sender, room, secret) {
  if (current || booting) return;

  booting = true;
  setBusy(true);

  try {
    if (
      !isSecureContext ||
      !crypto.subtle ||
      !window.Peer
    ) {
      throw new Error(
        "HTTPS və yüklənmiş PeerJS kitabxanası lazımdır."
      );
    }

    const files = sender
      ? selectedFiles.slice()
      : [];

    const total = sender
      ? ZipStream.estimateZipSize(files)
      : 0;

    if (
      sender &&
      (
        !files.length ||
        total > 1024 ** 4
      )
    ) {
      throw new Error(
        "Fayl seçimi boşdur və ya ölçü 1 TB-dan böyükdür."
      );
    }

    const ice = await iceServers();

    const s = {
      sender,
      room,
      secret,
      ice,
      files,
      total,

      peerId: sender
        ? room
        : "ikimiz-r-" + randomId(),

      archive: sender ? randomId() : null,

      expires:
        Date.now() +
        (
          sender
            ? Number($("duration").value)
            : 86400000
        ),

      c: null,
      peer: null,
      receiver: null,
      sink: null,

      received: 0,
      completed: false,
      done: false,
      closed: false,

      io: Promise.resolve(),
      seen: new Set(),

      tries: 0,
      retryAt: 0,
      signalRetryAt: 0,

      preparing: false,
      started: Date.now()
    };

    current = s;
    session = s;

    $("error").hidden = true;
    $("offer").hidden = true;
    $("verifyArea").hidden = true;
    $("progressArea").hidden = true;
    $("downloadZip").hidden = true;
    $("endSession").hidden = false;

    setStatus("Mobil paylaşım hazırlanır…");

    s.watch = setInterval(
      () => tick(s),
      2000
    );

    setupPeer(s);
    void wake(s);

  } catch (error) {
    showError(error);

    if (!current) {
      setBusy(false);
    }
  } finally {
    booting = false;
  }
}

/* ======================================================
   HƏR BAĞLANTI ÜÇÜN AYRICA ŞİFRƏLİ KANAL
   ====================================================== */

function attach(s, connection, nonce) {
  const c = {
    conn: connection,
    nonce,
    closed: false,

    abort: new AbortController(),

    phase: "connecting",
    last: Date.now(),

    out: Promise.resolve(),
    input: Promise.resolve(),

    sent: 0,
    acked: 0
  };

  s.c = c;

  c.timer = setTimeout(
    () => retry(s, c),
    40000
  );

  /*
    Hər yeni bağlantıda ayrıca nonce istifadə edilir.
    Təkrar bağlantılar əvvəlki şifrəli paketləri qəbul etmir.
  */
  const cipherReady = makeCipher(
    s.secret,
    s.room + "|" + nonce,
    s.sender
  ).then(cipher => {
    c.cipher = cipher;
  });

  cipherReady.catch(() => {});

  connection.on("close", () => {
    if (valid(s, c)) retry(s, c);
  });

  connection.on("error", () => {
    if (valid(s, c)) retry(s, c);
  });

  connection.on("open", async () => {
    try {
      await cipherReady;

      if (!valid(s, c)) return;

      clearTimeout(c.timer);

      c.phase = "auth";

      c.timer = setTimeout(
        () => retry(s, c),
        15000
      );

      if (!s.sender) {
        await control(s, c, {
          op: "hello",
          v: 2
        });
      }
    } catch {
      retry(s, c);
    }
  });

  connection.on("data", packet => {
    c.input = c.input.then(async () => {
      await cipherReady;

      if (!valid(s, c)) return;

      const frame = await c.cipher.open(packet);

      if (!valid(s, c)) return;

      c.last = Date.now();

      await handle(s, c, frame);

    }).catch(error => {
      if (!valid(s, c)) return;

      if (
        s.storageError ||
        error.permanent
      ) {
        fatal(s, error);
      } else {
        retry(s, c);
      }
    });
  });
}

const connPeer = c => c.conn.peer;

async function offer(s, c) {
  c.phase = "offered";

  await control(s, c, {
    op: "offer",
    archive: s.archive,
    total: s.total,
    count: s.files.length
  });
}

/* ======================================================
   PAKETLƏRİN QƏBULU
   ====================================================== */

async function handle(
  s,
  c,
  { type, value: message }
) {
  if (type === 1) {
    if (
      s.sender ||
      c.phase !== "receiving" ||
      !s.sink ||
      s.completed ||
      s.received + message.length > s.total
    ) {
      throw permanent("Fayl axını uyğun deyil.");
    }

    /*
      Yazılar ardıcıldır.
      Yenidən qoşulma əvvəlki yazının bitməsini gözləyir.
    */
    s.io = s.io.then(async () => {
      if (!valid(s, c)) return;

      try {
        if (s.sink.writer) {
          await s.sink.writer.write(message);
        } else {
          if (
            s.received + message.length > MAX_RAM
          ) {
            throw new Error("Yaddaş həddi keçildi.");
          }

          s.sink.parts.push(message);
        }

        s.received += message.length;

      } catch (error) {
        s.storageError = true;
        throw error;
      }
    });

    await s.io;

    if (!valid(s, c)) return;

    mobileProgress(s, s.received);

    if (
      s.received - (c.lastAck || 0) >= 128 * 1024 ||
      s.received === s.total
    ) {
      c.lastAck = s.received;

      await control(s, c, {
        op: "ack",
        bytes: s.received
      });
    }

    return;
  }

  if (
    !message ||
    typeof message.op !== "string"
  ) {
    throw permanent("Mesaj uyğun deyil.");
  }

  if (message.op === "ping") return;

  if (message.op === "cancel") {
    throw permanent(
      "Qarşı tərəf paylaşımı bağladı."
    );
  }

  if (s.sender) {
    /* ---------------- GÖNDƏRƏN ---------------- */

    if (
      message.op === "hello" &&
      message.v === 2 &&
      c.phase === "auth"
    ) {
      clearTimeout(c.timer);

      s.tries = 0;
      c.phase = "approval";

      await control(s, c, {
        op: "welcome",
        expires: s.expires
      });

      if (!valid(s, c)) return;

      if (s.receiver === connPeer(c)) {
        /* Əvvəldən təsdiqlənmiş alıcıdır. */
        await offer(s, c);

      } else {
        $("verifyCode").textContent =
          await verificationCode(
            s.secret,
            s.room,
            connPeer(c)
          );

        if (!valid(s, c)) return;

        $("verifyArea").hidden = false;
        $("approve").hidden = false;

        status(
          s,
          "Alıcı qoşuldu. Kodu müqayisə edib icazə ver."
        );
      }

    } else if (
      message.op === "ready" &&
      c.phase === "offered"
    ) {
      if (
        message.archive !== s.archive ||
        !Number.isSafeInteger(message.offset) ||
        message.offset < 0 ||
        message.offset > s.total
      ) {
        throw permanent(
          "Bərpa mövqeyi uyğun deyil."
        );
      }

      c.phase = "sending";
      c.sent = message.offset;
      c.acked = message.offset;
      c.last = Date.now();

      s.started = Date.now();
      s.startOffset = message.offset;

      $("verifyArea").hidden = true;

      status(
        s,
        message.offset
          ? "Göndəriş qaldığı yerdən davam edir…"
          : "Fayllar göndərilir…"
      );

      void pump(
        s,
        c,
        message.offset
      ).catch(error => {
        if (!valid(s, c)) return;

        if (error.transient) {
          retry(s, c);
        } else {
          fatal(s, error);
        }
      });

    } else if (
      message.op === "ack" &&
      [
        "sending",
        "ending"
      ].includes(c.phase)
    ) {
      if (
        !Number.isSafeInteger(message.bytes) ||
        message.bytes < c.acked ||
        message.bytes > c.sent
      ) {
        throw permanent(
          "Qəbul təsdiqi uyğun deyil."
        );
      }

      c.acked = message.bytes;
      mobileProgress(s, message.bytes);

    } else if (
      message.op === "saved" &&
      c.phase === "ending" &&
      message.archive === s.archive &&
      message.bytes === s.total
    ) {
      s.completed = true;
      s.done = true;

      setStatus(
        "Tamamlandı — alıcı ZIP-i tam qəbul etdi."
      );

      mobileProgress(s, s.total);

      await control(s, c, {
        op: "final",
        archive: s.archive
      });

      clearTimeout(s.finishTimer);

      s.finishTimer = setTimeout(
        () => void shutdown(s),
        15000
      );

    } else {
      throw permanent(
        "Mesaj ardıcıllığı uyğun deyil."
      );
    }

  } else {
    /* ---------------- ALICI ---------------- */

    if (
      message.op === "welcome" &&
      c.phase === "auth"
    ) {
      if (
        !Number.isSafeInteger(message.expires) ||
        message.expires <= Date.now() ||
        message.expires > Date.now() + 86460000
      ) {
        throw permanent(
          "Linkin müddəti bitib."
        );
      }

      clearTimeout(c.timer);

      s.tries = 0;
      s.expires = message.expires;
      c.phase = "approval";

      if (!s.sink && !s.completed) {
        $("verifyCode").textContent =
          await verificationCode(
            s.secret,
            s.room,
            s.peerId
          );

        if (!valid(s, c)) return;

        $("verifyArea").hidden = false;

        status(
          s,
          "Kodu müqayisə edin. Göndərənin icazəsi gözlənilir."
        );
      }

    } else if (
      message.op === "offer" &&
      c.phase === "approval"
    ) {
      if (
        !/^[A-Za-z0-9_-]{22}$/.test(
          message.archive || ""
        ) ||
        !Number.isSafeInteger(message.total) ||
        message.total < 22 ||
        message.total > 1024 ** 4 ||
        !Number.isInteger(message.count) ||
        message.count < 1 ||
        message.count > 10000
      ) {
        throw permanent(
          "Arxiv məlumatı uyğun deyil."
        );
      }

      if (
        s.archive &&
        (
          s.archive !== message.archive ||
          s.total !== message.total
        )
      ) {
        throw permanent(
          "Bərpa edilən arxiv əvvəlki arxiv deyil."
        );
      }

      s.archive = message.archive;
      s.total = message.total;

      c.phase = "offered";

      $("verifyArea").hidden = true;

      if (s.sink || s.completed) {
        await beginReceive(s);

      } else {
        $("offerTitle").textContent =
          message.count +
          " fayl · " +
          formatSize(message.total);

        $("offerDetail").textContent =
          "ZIP telefonun yerli yaddaşında hazırlanacaq. " +
          "Yükləmə üçün əlavə boş yer də lazım ola bilər.";

        $("offer").hidden = false;
        $("saveZip").disabled = false;

        status(s, "Qəbul etməyə hazırsan.");
      }

    } else if (
      message.op === "end" &&
      c.phase === "receiving"
    ) {
      if (s.received !== s.total) {
        throw permanent(
          "ZIP tam alınmayıb."
        );
      }

      c.phase = "ending";

      if (!s.completed) {
        s.io = s.io.then(async () => {
          try {
            if (s.sink.writer) {
              await s.sink.writer.close();
              s.sink.writer = null;
            }

            const file = s.sink.handle
              ? await s.sink.handle.getFile()
              : new Blob(
                  s.sink.parts,
                  { type: "application/zip" }
                );

            if (!live(s)) return;

            if (file.size !== s.total) {
              throw new Error(
                "Yerli ZIP ölçüsü uyğun deyil."
              );
            }

            s.completed = true;
            s.done = true;

            s.sink.parts = [];

            showResult(s, file);

          } catch (error) {
            s.storageError = true;
            throw error;
          }
        });

        await s.io;
      }

      if (!valid(s, c)) return;

      mobileProgress(s, s.total);

      setStatus(
        "ZIP hazırdır. “ZIP-i yüklə” düyməsinə bas."
      );

      await control(s, c, {
        op: "saved",
        archive: s.archive,
        bytes: s.received
      });

    } else if (
      message.op === "final" &&
      s.completed &&
      message.archive === s.archive
    ) {
      await shutdown(s);

    } else {
      throw permanent(
        "Mesaj ardıcıllığı uyğun deyil."
      );
    }
  }
}

/* ======================================================
   TELEFONUN YERLİ FAYL SAHƏSİ — OPFS
   ====================================================== */

async function makeSink(s) {
  /*
    OPFS yoxdursa kiçik fayllar üçün əvvəlki
    yaddaş üsulu ehtiyat variant olaraq qalır.
  */
  if (!navigator.storage?.getDirectory) {
    if (s.total > MAX_RAM) {
      throw new Error(
        "Bu brauzerdə böyük fayl üçün yerli fayl sahəsi açıla bilmir. " +
        "200 MB-dan böyük arxivi yaddaşa toplamaq təhlükəsiz deyil."
      );
    }

    return {
      parts: []
    };
  }

  const estimate =
    await navigator.storage.estimate?.();

  if (
    estimate?.quota &&
    estimate.quota - (estimate.usage || 0) <
      s.total + 8 * 1024 * 1024
  ) {
    throw new Error(
      "Brauzerin ayırdığı yer bu ZIP üçün kifayət etmir."
    );
  }

  try {
    await navigator.storage.persist?.();
  } catch {}

  let directory;
  let name;
  let writer;

  try {
    const root =
      await navigator.storage.getDirectory();

    directory =
      await root.getDirectoryHandle(
        "ikimiz-mobile-v2",
        { create: true }
      );

    name =
      s.room +
      "-" +
      randomId(8) +
      ".zip";

    const handle =
      await directory.getFileHandle(
        name,
        { create: true }
      );

    writer =
      await handle.createWritable();

    if (!live(s)) {
      throw new Error(
        "Paylaşım bağlanıb."
      );
    }

    return {
      dir: directory,
      name,
      handle,
      writer,
      parts: []
    };

  } catch (error) {
    try {
      await writer?.abort();
    } catch {}

    try {
      if (directory && name) {
        await directory.removeEntry(name);
      }
    } catch {}

    throw error;
  }
}

/* ======================================================
   QƏBULA BAŞLAMA VƏ QALDIĞI YERDƏN DAVAM
   ====================================================== */

async function beginReceive(s) {
  if (!live(s) || s.preparing) return;

  s.preparing = true;
  $("saveZip").disabled = true;

  let c = null;
  let storageStage = true;

  try {
    if (!s.sink && !s.completed) {
      s.sink = await makeSink(s);
    }

    /*
      Köhnə bağlantıdan başlamış disk yazısı
      bitmədən bərpa mövqeyi göndərilmir.
    */
    await s.io;

    if (!live(s)) return;

    c = s.c;

    if (
      !c ||
      c.closed ||
      c.phase !== "offered"
    ) {
      return;
    }

    c.phase = "receiving";
    c.lastAck = s.received;
    c.last = Date.now();

    s.started = Date.now();
    s.startOffset = s.received;

    void wake(s);

    storageStage = false;

    await control(s, c, {
      op: "ready",
      archive: s.archive,
      offset: s.received
    });

    status(
      s,
      s.received
        ? "Qəbul qaldığı yerdən davam edir…"
        : "ZIP telefona qəbul edilir…"
    );

    mobileProgress(s, s.received);

  } catch (error) {
    if (live(s)) {
      if (storageStage) {
        fatal(s, error);
      } else {
        retry(s, c);
      }
    }

  } finally {
    s.preparing = false;

    /*
      Yaddaş hazırlanarkən yeni bağlantı artıq
      qurulubsa, qəbulu həmin bağlantıda başlat.
    */
    if (
      live(s) &&
      s.sink &&
      s.c?.phase === "offered"
    ) {
      Promise.resolve().then(
        () => beginReceive(s)
      );
    }
  }
}

/* ======================================================
   ZIP AXINININ GÖNDƏRİLMƏSİ
   ====================================================== */

async function pump(s, c, offset) {
  void wake(s);

  if (offset < s.total) {
    let position = 0;
    let lastPing = Date.now();

    const iterator = ZipStream.zipFiles(
      s.files,
      { signal: c.abort.signal }
    );

    for await (const chunk of iterator) {
      if (!valid(s, c)) return;

      for (
        let p = 0;
        p < chunk.length;
        p += 16384
      ) {
        if (!valid(s, c)) return;

        const block = chunk.subarray(
          p,
          p + 16384
        );

        const end =
          position + block.length;

        /*
          Alıcıya əvvəl çatmış hissə yenidən
          internetdən göndərilmir.
        */
        if (end <= offset) {
          position = end;

          if (
            Date.now() - lastPing > 5000
          ) {
            await control(s, c, {
              op: "ping"
            });

            lastPing = Date.now();
            c.last = Date.now();
          }

          continue;
        }

        const part = block.subarray(
          Math.max(
            0,
            offset - position
          )
        );

        position = end;

        while (
          valid(s, c) &&
          (
            c.sent - c.acked >= 512 * 1024 ||
            c.conn.dataChannel?.bufferedAmount >
              512 * 1024
          )
        ) {
          await new Promise(
            resolve => setTimeout(
              resolve,
              20
            )
          );
        }

        if (!valid(s, c)) return;

        await send(s, c, 1, part);

        c.sent += part.length;
      }
    }
  }

  if (!valid(s, c)) return;

  if (c.sent !== s.total) {
    throw permanent(
      "ZIP ölçüsü gözlənilənlə uyğun gəlmədi."
    );
  }

  c.phase = "ending";
  c.last = Date.now();

  await control(s, c, {
    op: "end"
  });

  status(
    s,
    "Alıcının ZIP-i tam saxlaması gözlənilir…"
  );
}

/* ======================================================
   HAZIR ZIP VƏ MÜVƏQQƏTİ NÜSXƏNİN SİLİNMƏSİ
   ====================================================== */

function showResult(s, file) {
  const url =
    URL.createObjectURL(file);

  const box =
    document.createElement("div");

  box.className = "notice";

  const heading =
    document.createElement("strong");

  heading.textContent =
    "ZIP hazırdır · " +
    formatSize(file.size);

  const paragraph =
    document.createElement("p");

  paragraph.textContent =
    "Əvvəl ZIP-i yüklə. Sonra bu saytın saxladığı " +
    "müvəqqəti nüsxəni silə bilərsən.";

  const download =
    document.createElement("a");

  download.className = "download";
  download.href = url;
  download.download = "ikimiz-fayllar.zip";
  download.textContent = "ZIP-i yüklə";

  const remove =
    document.createElement("button");

  remove.className = "secondary";
  remove.style.margin = "12px";
  remove.textContent =
    "Yüklədim — müvəqqəti nüsxəni sil";

  remove.onclick = async () => {
    remove.disabled = true;

    try {
      if (s.sink.dir) {
        await s.sink.dir.removeEntry(
          s.sink.name
        );
      }

      URL.revokeObjectURL(url);
      box.remove();

    } catch (error) {
      remove.disabled = false;
      showError(error);
    }
  };

  box.append(
    heading,
    paragraph,
    download,
    remove
  );

  output.append(box);
}

/* ======================================================
   ƏVVƏLKİ DÜYMƏLƏRİN YENİ MOBİL MƏNTİQƏ BAĞLANMASI
   ====================================================== */

$("createRoom").onclick = () => {
  if (!selectedFiles.length) return;

  if (
    !isSecureContext ||
    !crypto.subtle
  ) {
    showError(
      new Error(
        "Səhifəni HTTPS ünvanı ilə aç."
      )
    );
    return;
  }

  void start(
    true,
    "ikimiz-" + randomId(),
    randomId(32)
  );
};

$("joinRoom").onclick = () => {
  try {
    const link = new URL(
      $("joinLink").value,
      location.href
    );

    const version =
      new URLSearchParams(
        link.hash.slice(1)
      ).get("v");

    if (version !== "2") {
      throw new Error(
        "Bu əvvəlki versiyanın linkidir. " +
        "Göndərən yenilənmiş səhifədə yeni məxfi link yaratmalıdır."
      );
    }

    const { room, secret } =
      parseLink(
        $("joinLink").value
      );

    void start(
      false,
      room,
      secret
    );

  } catch (error) {
    showError(error);
  }
};

$("approve").onclick = async () => {
  const s = current;
  const c = s?.c;

  if (
    !s?.sender ||
    !c ||
    c.phase !== "approval"
  ) {
    return;
  }

  s.receiver = c.conn.peer;

  $("approve").hidden = true;

  try {
    await offer(s, c);

    status(
      s,
      "İcazə verildi. Alıcının başlaması gözlənilir."
    );

  } catch {
    retry(s, c);
  }
};

$("saveZip").onclick = () => {
  if (current) {
    void beginReceive(current);
  }
};

$("endSession").onclick = async () => {
  const s = current;
  if (!s) return;

  const c = s.c;

  try {
    if (
      c?.conn.open &&
      c.cipher
    ) {
      await control(s, c, {
        op: "cancel"
      });
    }
  } catch {}

  setStatus(
    s.completed
      ? "ZIP hazırdır."
      : "Paylaşım bağlandı."
  );

  await shutdown(s);
};

/* Telefonda sistemin paylaşım menyusu. */
const shareButton =
  document.createElement("button");

shareButton.textContent = "Linki paylaş";
shareButton.className = "secondary";

$("copyLink").after(shareButton);

shareButton.onclick = async () => {
  const url = $("shareLink").value;

  try {
    if (navigator.share) {
      await navigator.share({
        title: "Məxfi fayllar",
        url
      });
    } else {
      await navigator.clipboard.writeText(url);
    }

  } catch (error) {
    if (error.name !== "AbortError") {
      $("shareLink").select();
    }
  }
};

/* İnternet və səhifə aktivliyi bərpa olunanda yenidən yoxla. */
for (
  const event of [
    "online",
    "pageshow"
  ]
) {
  window.addEventListener(
    event,
    () => {
      if (current) {
        current.retryAt = 0;
        tick(current);
        void wake(current);
      }
    }
  );
}

document.addEventListener(
  "visibilitychange",
  () => {
    if (
      !document.hidden &&
      current
    ) {
      current.retryAt = 0;

      if (current.c) {
        current.c.last = Date.now();
      }

      tick(current);
      void wake(current);
    }
  }
);

/* Yeni linklə daxil olan alıcı avtomatik qoşulsun. */
if ($("joinLink").value) {
  $("joinRoom").click();
}

})();
</script>
