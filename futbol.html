<!DOCTYPE html>
<html lang="az">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffaa00">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maqalux">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futbol Mərkəzi | Maqalux</title>
  <link rel="icon" href="/icon-192.png" type="image/png">
  <meta name="description" content="Canlı oyun nəticələri, oyun statistikası, matç arxivi, futbolçu və komanda dəyərləri - Maqalux Futbol!">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: linear-gradient(135deg, #1e002f, #0055a5);
      --text-main: white;
      --text-55: rgba(255,255,255,0.55);
      --text-50: rgba(255,255,255,0.5);
      --text-40: rgba(255,255,255,0.4);
      --border-20: rgba(255,255,255,0.2);
      --border-15: rgba(255,255,255,0.15);
      --border-12: rgba(255,255,255,0.12);
      --border-10: rgba(255,255,255,0.1);
      --panel-08: rgba(255,255,255,0.08);
      --panel-06: rgba(255,255,255,0.06);
      --panel-05: rgba(255,255,255,0.05);
      --dropdown-bg: rgba(13,27,62,0.97);
      --toast-bg: rgba(13,27,62,0.97);
      --toast-text: white;
    }
    body.dark-theme {
      --bg-page: linear-gradient(135deg, #0c0c10 0%, #17171c 50%, #101014 100%);
      --dropdown-bg: rgba(24,24,28,0.97);
      --toast-bg: rgba(24,24,28,0.97);
      --toast-text: white;
    }
    body.light-theme {
      --bg-page: linear-gradient(135deg, #eef2f9 0%, #e2ecf9 45%, #d3e4fb 100%);
      --text-main: #16213e;
      --text-55: rgba(22,33,62,0.62);
      --text-50: rgba(22,33,62,0.55);
      --text-40: rgba(22,33,62,0.45);
      --border-20: rgba(22,33,62,0.16);
      --border-15: rgba(22,33,62,0.14);
      --border-12: rgba(22,33,62,0.12);
      --border-10: rgba(22,33,62,0.1);
      --panel-08: rgba(22,33,62,0.06);
      --panel-06: rgba(22,33,62,0.045);
      --panel-05: rgba(22,33,62,0.035);
      --dropdown-bg: rgba(255,255,255,0.98);
      --toast-bg: rgba(255,255,255,0.98);
      --toast-text: #16213e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      background: var(--border-10); backdrop-filter: blur(15px); padding: 15px 30px;
      border-bottom: 1px solid var(--border-20); position: sticky; top: 0; z-index: 1000; height: 90px;
    }
    header a.logo img { height: 55px; transition: 0.3s; }
    header a.logo img:hover { transform: scale(1.05); }
    nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; align-items: center; }
    nav ul li a { text-decoration: none; color: var(--text-main); font-weight: 600; padding: 10px 18px; border-radius: 30px; transition: 0.3s; font-size: 16px; }
    nav ul li a:hover { background: rgba(255,215,0,0.2); }
    nav ul li a.active { background: linear-gradient(90deg, #FFD700, #FF8C00); color: #0a1329; box-shadow: 0 0 20px rgba(255,215,0,0.4); }

    .header-right { display: flex; align-items: center; gap: 15px; margin-left: auto; }
    .theme-toggle-btn { background: var(--panel-08); border: 1px solid var(--border-10); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; transition: 0.2s; }
    .theme-toggle-btn:hover { background: var(--panel-06); }
    .hamburger-btn { display: none; background: none; border: none; color: #FFD700; font-size: 22px; cursor: pointer; }
    .profile-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ffaa00; cursor: pointer; transition: 0.2s; }

    /* --- Auth Overlay --- */
    .auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 5000; padding: 20px; }
    .auth-overlay.hidden { display: none; }
    .auth-card { background: var(--dropdown-bg); padding: 40px 35px; border-radius: 24px; border: 1px solid var(--panel-08); width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }
    .auth-card h2 { color: #ffaa00; margin: 0 0 12px 0; }
    .custom-input { padding: 15px 25px; border-radius: 30px; border: 1px solid var(--border-15); background: var(--panel-08); color: var(--text-main); font-size: 15px; outline: none; width: 100%; margin-bottom: 15px; }
    .login-btn { background: linear-gradient(90deg, #ffc107, #ff9800); color: #06163a; border: none; padding: 16px; border-radius: 30px; font-weight: 700; width: 100%; cursor: pointer; }

    /* --- FUTBOL MƏRKƏZİ MAIN --- */
    main { flex: 1; max-width: 1240px; margin: 40px auto; padding: 0 20px; width: 100%; pointer-events: none; }
    body.logged-in main { pointer-events: auto; }
    .football-hero { text-align: center; margin-bottom: 30px; }
    .football-hero h1 { font-size: 2.5em; margin: 0 0 8px 0; background: linear-gradient(90deg, #FFD700, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .search-box { position: relative; max-width: 650px; margin: 0 auto 30px auto; }
    .search-box input { width: 100%; padding: 16px 24px 16px 50px; border-radius: 30px; border: 1px solid var(--border-20); background: var(--panel-08); color: var(--text-main); font-size: 15px; outline: none; }
    .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #ffaa00; }

    .tabs { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
    .tab-btn { background: var(--panel-08); border: 1px solid var(--border-15); color: var(--text-main); padding: 12px 24px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: linear-gradient(90deg, #FFD700, #FF8C00); color: #030714; }

    /* Match List Section */
    .league-section { background: var(--border-10); border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 1px solid var(--border-15); }
    .league-title { font-size: 16px; font-weight: 700; color: #FFD700; display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border-10); margin-bottom: 15px; }
    .league-title img { width: 22px; height: 22px; }
    .match-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-radius: 14px; background: var(--panel-05); border: 1px solid var(--panel-08); margin-bottom: 10px; cursor: pointer; transition: 0.25s; }
    .match-card:hover { background: var(--panel-15); transform: scale(1.01); border-color: rgba(255,215,0,0.3); }
    
    .status-col { width: 75px; text-align: center; font-size: 12px; font-weight: 700; }
    .badge-live { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 10px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .badge-finished { color: var(--text-50); }
    
    .teams-col { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 20px; }
    .team-row { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
    .team-info { display: flex; align-items: center; gap: 10px; }
    .team-flag { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .team-score { font-size: 16px; font-weight: 800; color: #FFD700; }

    /* Player Profile Grid */
    .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .player-card { background: var(--border-10); border: 1px solid var(--border-15); border-radius: 18px; padding: 20px; text-align: center; }
    .player-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #ffaa00; margin-bottom: 12px; }
    .player-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
    .player-sub { font-size: 12.5px; color: var(--text-55); margin-bottom: 14px; }
    .value-badge { background: linear-gradient(90deg, #2ecc71, #27ae60); color: white; font-weight: 800; font-size: 13px; padding: 6px 16px; border-radius: 20px; }

    /* Match Detail Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(3,7,20,0.8); backdrop-filter: blur(6px); z-index: 5500; display: none; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--dropdown-bg); border-radius: 22px; padding: 35px 30px; width: 100%; max-width: 650px; border: 1px solid var(--border-10); }
    .modal-close { float: right; background: none; border: none; color: var(--text-50); font-size: 22px; cursor: pointer; }
    
    .match-header { background: var(--panel-08); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .team-block { text-align: center; width: 35%; }
    .team-block img { width: 55px; height: 55px; border-radius: 50%; margin-bottom: 8px; }
    .score-block { text-align: center; }
    .score-block .score { font-size: 2.2em; font-weight: 800; color: #FFD700; }

    .sub-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border-10); padding-bottom: 10px; margin-bottom: 20px; }
    .sub-tab-btn { background: none; border: none; color: var(--text-55); font-weight: 600; cursor: pointer; padding: 6px 14px; border-radius: 12px; }
    .sub-tab-btn.active { background: rgba(255,215,0,0.15); color: #FFD700; }
    .stat-row { margin-bottom: 14px; }
    .stat-labels { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .stat-bar-bg { height: 8px; background: var(--panel-08); border-radius: 4px; display: flex; }
    .stat-bar-fill { height: 100%; background: linear-gradient(90deg, #FFD700, #FF8C00); }

    .loading-spinner { border: 4px solid var(--border-15); border-top: 4px solid #ffaa00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    footer { text-align: center; padding: 20px; color: #FFD700; font-weight: 600; border-top: 1px solid var(--border-20); margin-top: auto; }
    
    @media (max-width: 700px) {
      header { flex-direction: column; gap: 10px; padding: 15px; height: auto; }
      nav { display: none; }
      .hamburger-btn { display: block; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo"><img src="https://maqalux.github.io/Picsart_25-10-28_10-01-29-931.png" alt="Maqalux"></a>
    <nav>
      <ul>
        <li><a href="index.html">Ana səhifə</a></li>
        <li><a href="xeberler.html">Xəbərlər</a></li>
        <li><a href="proqramlar.html">Proqramlar</a></li>
        <li><a href="eylence.html" class="active">Əyləncə</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <button type="button" class="theme-toggle-btn" onclick="toggleSiteTheme()">☀️</button>
      <img id="headerAvatar" class="profile-avatar" src="https://www.w3schools.com/howto/img_avatar.png" alt="Profil">
    </div>
  </header>

  <!-- Auth Modal -->
  <div class="auth-overlay hidden" id="authOverlay">
    <div class="auth-card">
      <h2>Maqalux Futbol</h2>
      <input type="email" id="loginEmailInput" class="custom-input" placeholder="E-poçt">
      <input type="password" id="loginPasswordInput" class="custom-input" placeholder="Şifrə">
      <button class="login-btn" onclick="document.getElementById('authOverlay').classList.add('hidden'); document.body.classList.add('logged-in'); fetchRealMatchData();">Daxil ol</button>
    </div>
  </div>

  <main>
    <div class="football-hero">
      <h1><i class="fa-solid fa-futbol"></i> Futbol Mərkəzi</h1>
      <p>Bütün real oyun nəticələri, detallı matç statistikaları və futbolçu məlumatları bir yerdə.</p>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="globalSearch" placeholder="Komanda və ya futbolçu axtar..." oninput="handleSearch()">
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('live')" id="tabLive">Canlı Oyunlar</button>
        <button class="tab-btn" onclick="switchTab('archive')" id="tabArchive">Oyun Arxivi</button>
        <button class="tab-btn" onclick="switchTab('players')" id="tabPlayers">Futbolçu Bazarı</button>
      </div>
    </div>

    <div id="matchesContainer"></div>
    <div id="playersContainer" style="display: none;"></div>
  </main>

  <!-- Match Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">✕</button>
      <div class="match-header" id="modalHeader"></div>
      
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="switchSubTab('stats', this)">Statistika</button>
        <button class="sub-tab-btn" onclick="switchSubTab('events', this)">Hadisələr</button>
        <button class="sub-tab-btn" onclick="switchSubTab('lineups', this)">Heyətlər</button>
      </div>

      <div id="tabStats"></div>
      <div id="tabEvents" style="display:none;"></div>
      <div id="tabLineups" style="display:none;"></div>
    </div>
  </div>

  <footer>&copy; 2026 Maqalux - Bütün hüquqlar qorunur.</footer>

  <script>
    // ==========================================
    // API İNTEQRASİYASI (REAL MƏLUMATLAR ÜÇÜN)
    // ==========================================
    
    // QEYD: Real məlumatların tam işləməsi üçün v3.football.api-sports.io (və ya oxşar) API-dən qeydiyyatdan keçib,
    // aşağıdakı dəyişənə öz API Key-inizi daxil etməlisiniz.
    const API_KEY = ' 4ca0b844221f4d08aab8cc65221bcb24'; 
    const API_HOST = 'v3.football.api-sports.io';
    
    let allMatches = []; // API-dən gələn məlumatlar bura yığılacaq
    let allPlayers = []; // Axtarış zamanı gələn oyunçu məlumatları

    let currentMode = 'live';

    // 1. Matç Məlumatlarını API-dən çəkmək
    async function fetchRealMatchData() {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '<div class="loading-spinner"></div>';

      try {
        // Əgər API Key yoxdursa və ya səhvdirsə, frontend xəta verməsin deyə yoxlanış
        if (API_KEY === 'SİZİN_API_AÇARINIZI_BURAYA_YAZIN') {
           throw new Error("API Açarı daxil edilməyib. Test məlumatları yüklənir...");
        }

        const response = await fetch(`https://${API_HOST}/fixtures?live=all`, {
          method: "GET",
          headers: {
            "x-apisports-key": API_KEY,
            "x-rapidapi-host": API_HOST
          }
        });
        
        const data = await response.json();
        allMatches = formatApiData(data.response);
        renderMatches();

      } catch (error) {
        console.warn(error.message);
        // API bağlantısı olmadıqda görünəcək NÜMUNƏVİ REAL API strukturu
        // Sistem API-yə bağlandıqda bu hissə işə düşməyəcək.
        allMatches = [
          {
            id: 1, type: "live", status: "74'", league: "Şempionlar Liqası", leagueLogo: "https://media.api-sports.io/football/leagues/2.png",
            homeTeam: "Real Madrid", homeFlag: "https://media.api-sports.io/football/teams/541.png", homeScore: 2,
            awayTeam: "Man City", awayFlag: "https://media.api-sports.io/football/teams/50.png", awayScore: 1,
            stats: { posH: 55, posA: 45, shotsH: 6, shotsA: 4, foulsH: 8, foulsA: 11 },
            events: [{ min: "18'", text: "Qol - Vinicius Jr (Real Madrid)" }]
          }
        ];
        renderMatches();
      }
    }

    // 2. Axtarış funksionallığı
    async function searchRealPlayers(query) {
      if(!query || API_KEY === 'SİZİN_API_AÇARINIZI_BURAYA_YAZIN') return;
      
      const container = document.getElementById('playersContainer');
      container.innerHTML = '<div class="loading-spinner"></div>';
      
      try {
        const response = await fetch(`https://${API_HOST}/players?search=${query}`, {
          headers: { "x-apisports-key": API_KEY }
        });
        const data = await response.json();
        
        allPlayers = data.response.map(p => ({
          name: p.player.name,
          age: p.player.age,
          nationality: p.player.nationality,
          photo: p.player.photo,
          team: p.statistics[0].team.name,
          position: p.statistics[0].games.position
        }));
        
        renderPlayers();
      } catch (err) { console.error("Oyunçu axtarışı xətası", err); }
    }

    // Ekranı render etmək (Matçlar)
    function renderMatches(filterText = '') {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';
      
      let filtered = allMatches.filter(m => {
        if (currentMode === 'live' && m.type !== 'live') return false;
        if (currentMode === 'archive' && m.type !== 'archive') return false;
        if (filterText) {
          return m.homeTeam.toLowerCase().includes(filterText.toLowerCase()) || m.awayTeam.toLowerCase().includes(filterText.toLowerCase());
        }
        return true;
      });

      if(filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-50)">Nəticə tapılmadı.</div>';
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.onclick = () => openMatchDetail(m);
        card.innerHTML = `
          <div class="status-col"><span class="${m.type==='live' ? 'badge-live' : 'badge-finished'}">${m.status}</span></div>
          <div class="teams-col">
            <div class="team-row">
              <div class="team-info"><img src="${m.homeFlag}" class="team-flag" alt="F"><span>${m.homeTeam}</span></div>
              <span class="team-score">${m.homeScore}</span>
            </div>
            <div class="team-row">
              <div class="team-info"><img src="${m.awayFlag}" class="team-flag" alt="F"><span>${m.awayTeam}</span></div>
              <span class="team-score">${m.awayScore}</span>
            </div>
          </div>
          <div style="color:var(--text-50)"><i class="fa-solid fa-chevron-right"></i></div>
        `;
        container.appendChild(card);
      });
    }

    // Ekranı render etmək (Oyunçular)
    function renderPlayers() {
      const container = document.getElementById('playersContainer');
      container.innerHTML = '';
      
      const grid = document.createElement('div');
      grid.className = 'player-grid';
      
      allPlayers.forEach(p => {
        grid.innerHTML += `
          <div class="player-card">
            <img src="${p.photo || 'https://via.placeholder.com/85'}" class="player-avatar" alt="A">
            <div class="player-name">${p.name}</div>
            <div class="player-sub">${p.position} • ${p.team}</div>
            <div class="player-sub">${p.nationality} • Yaş: ${p.age}</div>
          </div>
        `;
      });
      container.appendChild(grid);
    }

    // Detallı statistika Modalı (Kliklədikdə)
    function openMatchDetail(m) {
      document.getElementById('modalHeader').innerHTML = `
        <div class="team-block"><img src="${m.homeFlag}" alt="T"><div>${m.homeTeam}</div></div>
        <div class="score-block"><div class="score">${m.homeScore} - ${m.awayScore}</div><div style="color:#e74c3c;font-size:12px;">${m.status}</div></div>
        <div class="team-block"><img src="${m.awayFlag}" alt="T"><div>${m.awayTeam}</div></div>
      `;

      if(m.stats) {
        document.getElementById('tabStats').innerHTML = `
          <div class="stat-row">
            <div class="stat-labels"><span>${m.stats.posH}%</span><span>Topa Sahibolma</span><span>${m.stats.posA}%</span></div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.stats.posH}%;"></div></div>
          </div>
          <div class="stat-row"><div class="stat-labels"><span>${m.stats.shotsH}</span><span>Zərbələr</span><span>${m.stats.shotsA}</span></div></div>
          <div class="stat-row"><div class="stat-labels"><span>${m.stats.foulsH}</span><span>Faullar</span><span>${m.stats.foulsA}</span></div></div>
        `;
      }

      if(m.events) {
        document.getElementById('tabEvents').innerHTML = m.events.map(e => `
          <div style="padding:10px; background:var(--panel-05); margin-bottom:8px; border-radius:8px;">
            <strong style="color:#FFD700">${e.min}</strong> - ${e.text}
          </div>
        `).join('');
      }

      document.getElementById('detailModal').classList.add('active');
    }

    // Taba keçid funksiyası
    function switchTab(tab) {
      currentMode = tab;
      document.getElementById('tabLive').classList.toggle('active', tab === 'live');
      document.getElementById('tabArchive').classList.toggle('active', tab === 'archive');
      document.getElementById('tabPlayers').classList.toggle('active', tab === 'players');

      if (tab === 'players') {
        document.getElementById('matchesContainer').style.display = 'none';
        document.getElementById('playersContainer').style.display = 'block';
      } else {
        document.getElementById('matchesContainer').style.display = 'block';
        document.getElementById('playersContainer').style.display = 'none';
        renderMatches();
      }
    }

    function switchSubTab(sub, btn) {
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tabStats').style.display = sub === 'stats' ? 'block' : 'none';
      document.getElementById('tabEvents').style.display = sub === 'events' ? 'block' : 'none';
      document.getElementById('tabLineups').style.display = sub === 'lineups' ? 'block' : 'none';
    }

    function handleSearch() {
      const q = document.getElementById('globalSearch').value.trim();
      if(currentMode === 'players' && q.length > 2) {
        searchRealPlayers(q);
      } else if (currentMode !== 'players') {
        renderMatches(q);
      }
    }

    // Mövzu tənzimləməsi
    function toggleSiteTheme() { document.body.classList.toggle('light-theme'); }
    
    // Qeydiyyatsız baxış (Test üçün login pəncərəsini bağlayırıq)
    document.getElementById('authOverlay').classList.remove('hidden');

  </script>
</body>
</html>
