<!DOCTYPE html>
<html lang="az">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffaa00">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maqalux">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futbol Mərkəzi | Maqalux</title>
  <link rel="icon" href="/icon-192.png" type="image/png">
  <meta name="description" content="Canlı oyun nəticələri, oyun statistikası, matç arxivi və futbolçu məlumatları - Maqalux Futbol!">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: linear-gradient(135deg, #1e002f, #0055a5);
      --text-main: white;
      --text-55: rgba(255,255,255,0.55);
      --text-50: rgba(255,255,255,0.5);
      --border-20: rgba(255,255,255,0.2);
      --border-15: rgba(255,255,255,0.15);
      --border-10: rgba(255,255,255,0.1);
      --panel-08: rgba(255,255,255,0.08);
      --panel-05: rgba(255,255,255,0.05);
      --dropdown-bg: rgba(13,27,62,0.97);
    }
    body.light-theme {
      --bg-page: linear-gradient(135deg, #eef2f9 0%, #e2ecf9 45%, #d3e4fb 100%);
      --text-main: #16213e;
      --text-55: rgba(22,33,62,0.62);
      --text-50: rgba(22,33,62,0.55);
      --border-20: rgba(22,33,62,0.16);
      --border-15: rgba(22,33,62,0.14);
      --border-10: rgba(22,33,62,0.1);
      --panel-08: rgba(22,33,62,0.06);
      --panel-05: rgba(22,33,62,0.035);
      --dropdown-bg: rgba(255,255,255,0.98);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      background: var(--border-10); backdrop-filter: blur(15px); padding: 15px 30px;
      border-bottom: 1px solid var(--border-20); position: sticky; top: 0; z-index: 1000; height: 90px;
    }
    header a.logo img { height: 55px; transition: 0.3s; }
    header a.logo img:hover { transform: scale(1.05); }
    nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; align-items: center; }
    nav ul li a { text-decoration: none; color: var(--text-main); font-weight: 600; padding: 10px 18px; border-radius: 30px; transition: 0.3s; font-size: 16px; }
    nav ul li a:hover { background: rgba(255,215,0,0.2); }
    nav ul li a.active { background: linear-gradient(90deg, #FFD700, #FF8C00); color: #0a1329; box-shadow: 0 0 20px rgba(255,215,0,0.4); }

    .header-right { display: flex; align-items: center; gap: 15px; margin-left: auto; }
    .theme-toggle-btn { background: var(--panel-08); border: 1px solid var(--border-10); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; transition: 0.2s; }

    /* --- FUTBOL MƏRKƏZİ MAIN --- */
    main { flex: 1; max-width: 1240px; margin: 40px auto; padding: 0 20px; width: 100%; }
    .football-hero { text-align: center; margin-bottom: 30px; }
    .football-hero h1 { font-size: 2.5em; margin: 0 0 8px 0; background: linear-gradient(90deg, #FFD700, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .search-box { position: relative; max-width: 650px; margin: 0 auto 30px auto; }
    .search-box input { width: 100%; padding: 16px 24px 16px 50px; border-radius: 30px; border: 1px solid var(--border-20); background: var(--panel-08); color: var(--text-main); font-size: 15px; outline: none; }
    .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #ffaa00; }

    .tabs { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
    .tab-btn { background: var(--panel-08); border: 1px solid var(--border-15); color: var(--text-main); padding: 12px 24px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: linear-gradient(90deg, #FFD700, #FF8C00); color: #030714; }

    /* Match Cards */
    .match-card { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-radius: 16px; background: var(--panel-05); border: 1px solid var(--border-15); margin-bottom: 12px; cursor: pointer; transition: 0.25s; }
    .match-card:hover { transform: translateY(-2px); border-color: rgba(255,215,0,0.4); }
    
    .status-col { width: 85px; text-align: center; font-size: 12px; font-weight: 700; }
    .badge-live { background: #e74c3c; color: white; padding: 4px 10px; border-radius: 12px; animation: pulse 1.5s infinite; }
    .badge-finished { color: var(--text-50); background: var(--panel-08); padding: 4px 10px; border-radius: 12px; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    
    .teams-col { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
    .team-row { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
    .team-info { display: flex; align-items: center; gap: 12px; }
    .team-flag { width: 24px; height: 24px; border-radius: 50%; object-fit: contain; }
    .team-score { font-size: 18px; font-weight: 800; color: #FFD700; }

    /* Player Grid */
    .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .player-card { background: var(--panel-05); border: 1px solid var(--border-15); border-radius: 18px; padding: 20px; text-align: center; }
    .player-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #ffaa00; margin-bottom: 12px; }
    .player-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
    .player-sub { font-size: 13px; color: var(--text-55); margin-top: 4px; }

    /* Detail Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(3,7,20,0.8); backdrop-filter: blur(6px); z-index: 5500; display: none; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--dropdown-bg); border-radius: 22px; padding: 35px 30px; width: 100%; max-width: 650px; border: 1px solid var(--border-10); }
    .modal-close { float: right; background: none; border: none; color: var(--text-50); font-size: 22px; cursor: pointer; }
    
    .match-header { background: var(--panel-08); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .team-block { text-align: center; width: 35%; font-weight: 600; }
    .team-block img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
    .score-block { text-align: center; }
    .score-block .score { font-size: 2.2em; font-weight: 800; color: #FFD700; }

    .loading-spinner { border: 4px solid var(--border-15); border-top: 4px solid #ffaa00; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    footer { text-align: center; padding: 20px; color: #FFD700; font-weight: 600; border-top: 1px solid var(--border-20); margin-top: auto; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo"><img src="https://maqalux.github.io/Picsart_25-10-28_10-01-29-931.png" alt="Maqalux"></a>
    <nav>
      <ul>
        <li><a href="index.html">Ana səhifə</a></li>
        <li><a href="xeberler.html">Xəbərlər</a></li>
        <li><a href="proqramlar.html">Proqramlar</a></li>
        <li><a href="eylence.html" class="active">Əyləncə</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <button type="button" class="theme-toggle-btn" onclick="document.body.classList.toggle('light-theme')">☀️</button>
    </div>
  </header>

  <main>
    <div class="football-hero">
      <h1><i class="fa-solid fa-futbol"></i> Futbol Mərkəzi</h1>
      <p>Bütün real oyun nəticələri, xallar və futbolçu profil məlumatları bir yerdə.</p>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="globalSearch" placeholder="Komanda və ya futbolçu axtar (Min. 3 hərf)..." oninput="handleSearch()">
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('live')" id="tabLive">Canlı Oyunlar</button>
        <button class="tab-btn" onclick="switchTab('today')" id="tabToday">Bu Günün Matçları</button>
        <button class="tab-btn" onclick="switchTab('players')" id="tabPlayers">Futbolçu Axtarışı</button>
      </div>
    </div>

    <div id="matchesContainer"></div>
    <div id="playersContainer" style="display: none;"></div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">✕</button>
      <div class="match-header" id="modalHeader"></div>
      <div id="modalContent" style="text-align: center; color: var(--text-55); font-size: 14px;"></div>
    </div>
  </div>

  <footer>&copy; 2026 Maqalux - Bütün hüquqlar qorunur.</footer>

  <script>
    // ==========================================
    // SİZİN DAXİL ETDİYİNİZ REAL API AÇARI
    // ==========================================
    const API_KEY = 'f73add2328ec3a760f3e74f4d3f5700e'; 
    const API_HOST = 'v3.football.api-sports.io';
    
    let allMatches = [];
    let currentMode = 'live';

    // 1. Matç Məlumatlarını API-dən çəkmək
    async function fetchMatches(endpoint = 'fixtures?live=all') {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '<div class="loading-spinner"></div>';

      try {
        const response = await fetch(`https://${API_HOST}/${endpoint}`, {
          method: "GET",
          headers: {
            "x-apisports-key": API_KEY,
            "x-rapidapi-host": API_HOST
          }
        });
        
        const data = await response.json();
        
        if (!data.response || data.response.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-50)">Hal-hazırda aktiv oyun tapılmadı.</div>';
          return;
        }

        allMatches = data.response;
        renderMatches();

      } catch (error) {
        console.error("API xətası:", error);
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#e74c3c">Məlumatları çəkərkən xəta baş verdi. Zəhmət olmasa bir az sonra yenidən cəhd edin.</div>';
      }
    }

    // 2. Futbolçu Axtarışı
    async function searchPlayers(query) {
      const container = document.getElementById('playersContainer');
      container.innerHTML = '<div class="loading-spinner"></div>';
      
      try {
        const response = await fetch(`https://${API_HOST}/players?search=${query}`, {
          method: "GET",
          headers: {
            "x-apisports-key": API_KEY,
            "x-rapidapi-host": API_HOST
          }
        });
        const data = await response.json();

        if (!data.response || data.response.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-50)">Uyğun futbolçu tapılmadı.</div>';
          return;
        }

        renderPlayers(data.response);
      } catch (err) { 
        console.error("Oyunçu axtarışı xətası:", err); 
      }
    }

    // Matçları Ekrana Düzmək
    function renderMatches(filterText = '') {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';

      let filtered = allMatches.filter(item => {
        if (!filterText) return true;
        const home = item.teams.home.name.toLowerCase();
        const away = item.teams.away.name.toLowerCase();
        return home.includes(filterText.toLowerCase()) || away.includes(filterText.toLowerCase());
      });

      if(filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-50)">Axtarışa uyğun nəticə tapılmadı.</div>';
        return;
      }

      filtered.forEach(m => {
        const status = m.fixture.status.short;
        const isLive = ['1H', 'HT', '2H', 'ET', 'P', 'LIVE'].includes(status);
        const el = document.createElement('div');
        el.className = 'match-card';
        el.onclick = () => openModal(m);
        
        el.innerHTML = `
          <div class="status-col">
            <span class="${isLive ? 'badge-live' : 'badge-finished'}">
              ${isLive ? m.fixture.status.elapsed + "'" : status}
            </span>
          </div>
          <div class="teams-col">
            <div class="team-row">
              <div class="team-info">
                <img src="${m.teams.home.logo}" class="team-flag" alt="">
                <span>${m.teams.home.name}</span>
              </div>
              <span class="team-score">${m.goals.home ?? 0}</span>
            </div>
            <div class="team-row">
              <div class="team-info">
                <img src="${m.teams.away.logo}" class="team-flag" alt="">
                <span>${m.teams.away.name}</span>
              </div>
              <span class="team-score">${m.goals.away ?? 0}</span>
            </div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    // Futbolçuları Ekrana Düzmək
    function renderPlayers(players) {
      const container = document.getElementById('playersContainer');
      container.innerHTML = '';
      
      const grid = document.createElement('div');
      grid.className = 'player-grid';
      
      players.forEach(p => {
        const player = p.player;
        const stat = p.statistics[0] || {};
        grid.innerHTML += `
          <div class="player-card">
            <img src="${player.photo}" class="player-avatar" alt="">
            <div class="player-name">${player.name}</div>
            <div class="player-sub">${stat.team ? stat.team.name : 'Məlumat yoxdur'}</div>
            <div class="player-sub">Mövqe: ${stat.games?.position || '-'} | Yaş: ${player.age || '-'}</div>
          </div>
        `;
      });
      container.appendChild(grid);
    }

    // Tab dəyişiklikləri
    function switchTab(tab) {
      currentMode = tab;
      document.getElementById('tabLive').classList.toggle('active', tab === 'live');
      document.getElementById('tabToday').classList.toggle('active', tab === 'today');
      document.getElementById('tabPlayers').classList.toggle('active', tab === 'players');

      if (tab === 'players') {
        document.getElementById('matchesContainer').style.display = 'none';
        document.getElementById('playersContainer').style.display = 'block';
        document.getElementById('playersContainer').innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-50)">Axtarmaq istədiyiniz futbolçunun adını yuxarıda yazın.</div>';
      } else {
        document.getElementById('matchesContainer').style.display = 'block';
        document.getElementById('playersContainer').style.display = 'none';
        
        if(tab === 'live') {
          fetchMatches('fixtures?live=all');
        } else if(tab === 'today') {
          const today = new Date().toISOString().split('T')[0];
          fetchMatches(`fixtures?date=${today}`);
        }
      }
    }

    // Modal pəncərəsi
    function openModal(m) {
      document.getElementById('modalHeader').innerHTML = `
        <div class="team-block"><img src="${m.teams.home.logo}" alt=""><div>${m.teams.home.name}</div></div>
        <div class="score-block">
          <div class="score">${m.goals.home ?? 0} - ${m.goals.away ?? 0}</div>
          <div style="color:#ffaa00; font-size:13px; margin-top:5px;">${m.league.name}</div>
        </div>
        <div class="team-block"><img src="${m.teams.away.logo}" alt=""><div>${m.teams.away.name}</div></div>
      `;
      document.getElementById('modalContent').innerText = `Məkan: ${m.fixture.venue.name || 'Məlum deyil'} (${m.fixture.venue.city || ''})`;
      document.getElementById('detailModal').classList.add('active');
    }

    // Axtarış klaviaturası
    let searchTimeout;
    function handleSearch() {
      clearTimeout(searchTimeout);
      const query = document.getElementById('globalSearch').value.trim();
      
      searchTimeout = setTimeout(() => {
        if (currentMode === 'players') {
          if(query.length >= 3) searchPlayers(query);
        } else {
          renderMatches(query);
        }
      }, 500);
    }

    // Səhifə yüklənəndə canlı matçları gətir
    fetchMatches('fixtures?live=all');
  </script>
</body>
</html>
