<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futbol Mərkəzi | Maqalux</title>
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ===== QLOBAL DƏYİŞƏNLƏR ===== */
    :root {
      --bg-page: linear-gradient(135deg, #1e002f, #0055a5);
      --text-main: white;
      --text-55: rgba(255,255,255,0.55);
      --text-50: rgba(255,255,255,0.5);
      --border-20: rgba(255,255,255,0.2);
      --border-15: rgba(255,255,255,0.15);
      --border-10: rgba(255,255,255,0.1);
      --panel-08: rgba(255,255,255,0.08);
      --panel-05: rgba(255,255,255,0.05);
      --dropdown-bg: rgba(13,27,62,0.97);
    }
    body.light-theme {
      --bg-page: linear-gradient(135deg, #eef2f9 0%, #e2ecf9 45%, #d3e4fb 100%);
      --text-main: #16213e;
      --text-55: rgba(22,33,62,0.62);
      --text-50: rgba(22,33,62,0.55);
      --border-20: rgba(22,33,62,0.16);
      --border-15: rgba(22,33,62,0.14);
      --border-10: rgba(22,33,62,0.1);
      --panel-08: rgba(22,33,62,0.06);
      --panel-05: rgba(22,33,62,0.035);
      --dropdown-bg: rgba(255,255,255,0.98);
    }
    body.dark-theme {
      --bg-page: linear-gradient(135deg, #0c0c10 0%, #17171c 50%, #101014 100%);
      --dropdown-bg: rgba(24,24,28,0.97);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      background: var(--border-10);
      backdrop-filter: blur(15px);
      padding: 15px 30px;
      border-bottom: 1px solid var(--border-20);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header a.logo img { height: 50px; transition: 0.3s; }
    nav ul {
      list-style: none;
      display: flex;
      gap: 10px;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }
    nav ul li a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 15px;
      transition: 0.2s;
    }
    nav ul li a.active {
      background: linear-gradient(90deg, #FFD700, #FF8C00);
      color: #0a1329;
    }
    .theme-toggle-btn {
      background: var(--panel-08);
      border: 1px solid var(--border-10);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }
    .theme-toggle-btn:hover { background: var(--border-20); }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
    }
    .football-hero { text-align: center; margin-bottom: 30px; }
    .football-hero h1 {
      font-size: 2.2em;
      margin: 0 0 10px 0;
      color: #FFD700;
    }
    .football-hero h1 i { margin-right: 12px; }

    /* ===== AXTARIŞ ===== */
    .search-container {
      display: flex;
      max-width: 650px;
      margin: 0 auto 30px auto;
      gap: 10px;
    }
    .search-box {
      position: relative;
      flex: 1;
    }
    .search-box input {
      width: 100%;
      padding: 15px 20px 15px 45px;
      border-radius: 25px;
      border: 1px solid var(--border-20);
      background: var(--panel-08);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .search-box input:focus { border-color: #FFD700; }
    .search-box i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #ffaa00;
    }
    .search-btn {
      background: linear-gradient(90deg, #FFD700, #FF8C00);
      color: #0a1329;
      border: none;
      padding: 0 25px;
      border-radius: 25px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
    }
    .search-btn:hover { opacity: 0.8; }

    /* ===== TABLAR ===== */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .tab-btn {
      background: var(--panel-08);
      border: 1px solid var(--border-15);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
    }
    .tab-btn:hover { background: var(--border-15); }
    .tab-btn.active {
      background: #FFD700;
      color: #000;
      border-color: #FFD700;
    }

    /* ===== MATÇ KARTLARI ===== */
    .match-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--panel-08);
      border: 1px solid var(--border-15);
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .match-card:hover {
      transform: translateY(-2px);
      border-color: #ffaa00;
      background: var(--panel-05);
    }
    .status-col {
      width: 85px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-live {
      background: #e74c3c;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      animation: pulse 1.5s infinite;
      display: inline-block;
    }
    .badge-finished {
      color: var(--text-main);
      background: var(--border-20);
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
    }
    .badge-scheduled {
      color: #ffaa00;
      background: rgba(255,170,0,0.14);
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
    }
    .match-time {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-50);
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .teams-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 20px;
    }
    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }
    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .team-flag {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .team-score {
      font-size: 18px;
      font-weight: 800;
      color: #FFD700;
    }

    /* ===== FUTBOLÇU KARTLARI ===== */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .player-card {
      background: var(--panel-08);
      border: 1px solid var(--border-15);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: 0.2s;
    }
    .player-card:hover { border-color: #ffaa00; }
    .player-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffaa00;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-08);
    }
    .player-avatar i { font-size: 30px; color: #ffaa00; }
    .player-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .player-sub {
      font-size: 13px;
      color: var(--text-55);
      margin-top: 5px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 5000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--dropdown-bg);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border-15);
      position: relative;
    }
    .modal-close {
      position: absolute;
      right: 20px;
      top: 15px;
      background: none;
      border: none;
      color: var(--text-50);
      font-size: 24px;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal-close:hover { color: var(--text-main); }
    .match-header {
      background: var(--panel-08);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 20px 0;
    }
    .team-block {
      text-align: center;
      width: 35%;
      font-weight: 600;
      font-size: 14px;
    }
    .team-block img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .score-block {
      text-align: center;
    }
    .score-block .score {
      font-size: 2em;
      font-weight: 800;
      color: #FFD700;
    }
    .score-block .status-label {
      color: #ffaa00;
      font-size: 12px;
      margin-top: 5px;
    }

    /* ===== YÜKLƏMƏ ===== */
    .loading-spinner {
      border: 4px solid var(--border-15);
      border-top: 4px solid #ffaa00;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: var(--text-50);
      font-size: 16px;
    }
    .error-message {
      text-align: center;
      padding: 30px;
      color: #e74c3c;
      background: rgba(231,76,60,0.1);
      border-radius: 16px;
      border: 1px solid rgba(231,76,60,0.3);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      header { flex-direction: column; gap: 10px; }
      .match-card { flex-wrap: wrap; }
      .status-col { width: 100%; margin-bottom: 8px; }
      .teams-col { padding: 0; }
    }
  </style>
</head>

  <header>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="football-hero">
      <h1><i class="fa-solid fa-futbol"></i> Futbol Mərkəzi</h1>

      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="globalSearch" placeholder="Komanda və ya futbolçu adı daxil edin..." />
        </div>
        <button class="search-btn" id="searchBtn"><i class="fas fa-arrow-right"></i> Axtar</button>

    <!-- Matçlar üçün konteyner -->
    <div id="matchesContainer"></div>

    <!-- Futbolçular üçün konteyner (əvvəldə gizli) -->
    <div id="playersContainer" style="display: none;"></div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="modal-close" id="closeModalBtn">✕</button>
      <div class="match-header" id="modalHeader">
        <!-- Dinamik olaraq doldurulur -->
      </div>
      <div id="modalBody" style="text-align:center; padding:20px; color:var(--text-50);">
        Ətraflı statistika pulsuz planda mövcud deyil.
      </div>
    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script>
    (function() {
      "use strict";

      // ============================================================
      // 1. KONFİQURASİYA
      // ============================================================

      const API_KEY = '4ca0b844221f4d08aab8cc65221bcb24'; // Öz açarınızı daxil edin
      const PROXY_URL = 'https://futbol-proxy.mehemmedeliyev908.workers.dev'; // Öz proksiniz

      // ============================================================
      // 2. ELEMENTLƏR
      // ============================================================

      const tabs = document.querySelectorAll('.tab-btn');
      const searchInput = document.getElementById('globalSearch');
      const searchBtn = document.getElementById('searchBtn');
      const matchesContainer = document.getElementById('matchesContainer');
      const playersContainer = document.getElementById('playersContainer');
      const modalOverlay = document.getElementById('detailModal');
      const modalHeader = document.getElementById('modalHeader');
      const modalBody = document.getElementById('modalBody');
      const closeModalBtn = document.getElementById('closeModalBtn');

      let currentTab = 'live';
      let allMatches = [];

      // ============================================================
      // 3. KÖMƏKÇİ FUNKSİYALAR
      // ============================================================

      // Tarixi ISO formatına çevir (YYYY-MM-DD)
      function formatDate(date) {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      // API sorğusu (proksi ilə)
      async function fetchApi(endpoint) {
        const url = `https://api.football-data.org/v4/${endpoint}`;
        const proxyUrl = `${PROXY_URL}/?url=${encodeURIComponent(url)}`;

        try {
          const response = await fetch(proxyUrl, {
            headers: {
              'X-Auth-Token': API_KEY,
              'Accept': 'application/json'
            }
          });
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText}`);
          }
          const data = await response.json();
          return data;
        } catch (err) {
          console.error('API sorğu xətası:', err);
          return null;
        }
      }

      // Yükləmə animasiyası
      function showLoading(container) {
        container.innerHTML = '<div class="loading-spinner"></div>';
      }

      // Boş mesaj
      function showEmpty(container, msg = 'Heç bir məlumat tapılmadı.') {
        container.innerHTML = `<div class="empty-message">${msg}</div>`;
      }

      // Xəta mesajı
      function showError(container, msg = 'Məlumat yüklənərkən xəta baş verdi.') {
        container.innerHTML = `<div class="error-message">⚠️ ${msg}</div>`;
      }

      // ============================================================
      // 4. MATÇLARI GÖSTƏR
      // ============================================================

      function renderMatches(matches, container) {
        if (!matches || matches.length === 0) {
          showEmpty(container, 'Bu kateqoriyada oyun yoxdur.');
          return;
        }

        container.innerHTML = '';
        matches.forEach(m => {
          const status = m.status || 'SCHEDULED';
          const isLive = ['IN_PLAY', 'PAUSED'].includes(status);
          const isScheduled = ['TIMED', 'SCHEDULED'].includes(status);
          const isFinished = status === 'FINISHED';

          const kickoff = new Date(m.utcDate);
          const now = new Date();
          const isToday = kickoff.toDateString() === now.toDateString();
          const timeStr = kickoff.toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit' });
          const dateStr = kickoff.toLocaleDateString('az-AZ', { day: '2-digit', month: '2-digit' });
          const timeLabel = isToday ? timeStr : `${dateStr} · ${timeStr}`;

          let displayStatus = status;
          if (isLive) displayStatus = 'Canlı';
          else if (isScheduled) displayStatus = 'Başlayacaq';
          else if (isFinished) displayStatus = 'Bitdi';

          const homeScore = m.score?.fullTime?.home ?? m.score?.halfTime?.home ?? 0;
          const awayScore = m.score?.fullTime?.away ?? m.score?.halfTime?.away ?? 0;

          const card = document.createElement('div');
          card.className = 'match-card';
          card.addEventListener('click', () => openMatchDetail(m));

          card.innerHTML = `
            <div class="status-col">
              <span class="${isLive ? 'badge-live' : (isScheduled ? 'badge-scheduled' : 'badge-finished')}">
                ${displayStatus}
              </span>
              <span class="match-time">${timeLabel}</span>
            </div>
            <div class="teams-col">
              <div class="team-row">
                <div class="team-info">
                  <img src="${m.homeTeam?.crest || ''}" class="team-flag" alt="" />
                  <span>${m.homeTeam?.name || '?'}</span>
                </div>
                <span class="team-score">${isScheduled ? '-' : homeScore}</span>
              </div>
              <div class="team-row">
                <div class="team-info">
                  <img src="${m.awayTeam?.crest || ''}" class="team-flag" alt="" />
                  <span>${m.awayTeam?.name || '?'}</span>
                </div>
                <span class="team-score">${isScheduled ? '-' : awayScore}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      // ============================================================
      // 5. MÜXTƏLİF KATEQORİYALAR ÜÇÜN MƏLUMAT YÜKLƏ
      // ============================================================

      async function loadMatches(tab) {
        showLoading(matchesContainer);
        playersContainer.style.display = 'none';
        matchesContainer.style.display = 'block';

        let endpoint = '';
        if (tab === 'live') {
          endpoint = 'matches?status=IN_PLAY,PAUSED';
        } else if (tab === 'today') {
          const today = formatDate(new Date());
          endpoint = `matches?dateFrom=${today}&dateTo=${today}`;
        } else if (tab === 'tomorrow') {
          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          const tmrw = formatDate(tomorrow);
          endpoint = `matches?dateFrom=${tmrw}&dateTo=${tmrw}`;
        } else {
          return;
        }

        const data = await fetchApi(endpoint);
        if (!data) {
          showError(matchesContainer, 'API-dən cavab alınmadı. Zəhmət olmasa bir neçə dəqiqə sonra yenidən cəhd edin.');
          return;
        }
        if (!data.matches || data.matches.length === 0) {
          showEmpty(matchesContainer, 'Bu kateqoriyada oyun yoxdur.');
          return;
        }
        allMatches = data.matches;
        renderMatches(allMatches, matchesContainer);
      }

      // ============================================================
      // 6. FUTBOLÇU AXTARIŞI
      // ============================================================

      // Əl ilə əlavə edilmiş oyunçu bazası (nümunə)
      const MANUAL_PLAYERS = [
        { name: 'Lionel Messi', team: 'Inter Miami', position: 'Hücumçu', age: 37, nationality: 'Argentina', photo: '', stats: { appearances: 15, goals: 12, assists: 8 } },
        { name: 'Cristiano Ronaldo', team: 'Al-Nassr', position: 'Hücumçu', age: 39, nationality: 'Portugal', photo: '', stats: { appearances: 20, goals: 22, assists: 5 } },
        { name: 'Kylian Mbappé', team: 'Real Madrid', position: 'Hücumçu', age: 25, nationality: 'France', photo: '', stats: { appearances: 18, goals: 16, assists: 7 } },
        { name: 'Erling Haaland', team: 'Manchester City', position: 'Hücumçu', age: 24, nationality: 'Norway', photo: '', stats: { appearances: 22, goals: 25, assists: 4 } },
        { name: 'Kevin De Bruyne', team: 'Manchester City', position: 'Yarımmüdafiəçi', age: 33, nationality: 'Belgium', photo: '', stats: { appearances: 19, goals: 6, assists: 12 } },
        { name: 'Mohamed Salah', team: 'Liverpool', position: 'Hücumçu', age: 32, nationality: 'Egypt', photo: '', stats: { appearances: 21, goals: 18, assists: 9 } },
      ];

      async function searchPlayers(query) {
        if (query.length < 3) {
          playersContainer.innerHTML = `<div class="empty-message">Axtarış üçün ən azı 3 hərf yazın.</div>`;
          return;
        }

        showLoading(playersContainer);
        matchesContainer.style.display = 'none';
        playersContainer.style.display = 'block';

        const results = [];

        // 1) Manual bazada axtar
        const manualMatches = MANUAL_PLAYERS.filter(p =>
          p.name.toLowerCase().includes(query.toLowerCase()) ||
          p.team.toLowerCase().includes(query.toLowerCase())
        );
        results.push(...manualMatches);

        // 2) TheSportsDB-dən axtar (əlavə mənbə)
        try {
          const tsdbRes = await fetch(
            `https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(query)}`
          );
          const tsdbData = await tsdbRes.json();
          if (tsdbData && tsdbData.player) {
            const tsdbPlayers = tsdbData.player
              .filter(p => p.strSport === 'Soccer')
              .filter(p => !results.some(r => r.name.toLowerCase() === p.strPlayer.toLowerCase()))
              .slice(0, 10)
              .map(p => ({
                name: p.strPlayer,
                team: p.strTeam || '-',
                position: p.strPosition || '-',
                age: p.dateBorn ? new Date().getFullYear() - new Date(p.dateBorn).getFullYear() : '-',
                nationality: p.strNationality || '-',
                photo: p.strThumb || p.strCutout || p.strRender || '',
                stats: { appearances: '-', goals: '-', assists: '-' },
                source: 'TheSportsDB'
              }));
            results.push(...tsdbPlayers);
          }
        } catch (e) {
          console.warn('TheSportsDB sorğu xətası:', e);
        }

        if (results.length === 0) {
          playersContainer.innerHTML = `<div class="empty-message">"${query}" üçün heç bir futbolçu tapılmadı.</div>`;
          return;
        }

        // Kartları yarat
        const grid = document.createElement('div');
        grid.className = 'player-grid';
        results.forEach(p => {
          const card = document.createElement('div');
          card.className = 'player-card';
          const hasStats = p.stats.appearances != null && p.stats.appearances !== '-';

          const avatarHTML = p.photo
            ? `<img src="${p.photo}" class="player-avatar" alt="${p.name}" />`
            : `<div class="player-avatar"><i class="fa-solid fa-user"></i></div>`;

          card.innerHTML = `
            ${avatarHTML}
            <div class="player-name">${p.name}</div>
            <div class="player-sub" style="color:#FFD700; font-weight:600;">${p.team}</div>
            <div class="player-sub">Mövqe: ${p.position} | Yaş: ${p.age}</div>
            <div class="player-sub">Milliyyət: ${p.nationality}</div>
            ${hasStats ? `<div class="player-sub">Oyun: ${p.stats.appearances} | Qol: ${p.stats.goals} | Asist: ${p.stats.assists}</div>` : ''}
            ${p.source ? `<div class="player-sub" style="font-size:11px; color:var(--text-50); margin-top:6px;">Mənbə: ${p.source}</div>` : ''}
          `;
          grid.appendChild(card);
        });
        playersContainer.innerHTML = '';
        playersContainer.appendChild(grid);
      }

      // ============================================================
      // 7. MODAL (MATÇ DETALLARI)
      // ============================================================

      function openMatchDetail(match) {
        const isScheduled = ['TIMED', 'SCHEDULED'].includes(match.status);
        const homeScore = match.score?.fullTime?.home ?? 0;
        const awayScore = match.score?.fullTime?.away ?? 0;
        let statusText = match.status;
        if (statusText === 'FINISHED') statusText = 'Oyun Bitdi';
        else if (['IN_PLAY', 'PAUSED'].includes(statusText)) statusText = 'Canlı Oyun';
        else if (['TIMED', 'SCHEDULED'].includes(statusText)) statusText = 'Başlamayıb';

        modalHeader.innerHTML = `
          <div class="team-block">
            <img src="${match.homeTeam?.crest || ''}" alt="" />
            <div>${match.homeTeam?.name || '?'}</div>
          </div>
          <div class="score-block">
            <div class="score">${isScheduled ? '-' : homeScore} - ${isScheduled ? '-' : awayScore}</div>
            <div class="status-label">${statusText}</div>
          </div>
          <div class="team-block">
            <img src="${match.awayTeam?.crest || ''}" alt="" />
            <div>${match.awayTeam?.name || '?'}</div>
          </div>
        `;
        modalBody.innerHTML = `<div style="padding:20px; color:var(--text-50);">football-data.org pulsuz planında ətraflı statistika təqdim edilmir.</div>`;
        modalOverlay.classList.add('active');
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
      }

      // ============================================================
      // 8. TAB KEÇİDLƏRİ
      // ============================================================

      function switchTab(tab) {
        currentTab = tab;
        tabs.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });

        // Axtarış sahəsini təmizlə
        searchInput.value = '';

        if (tab === 'players') {
          playersContainer.style.display = 'block';
          matchesContainer.style.display = 'none';
          playersContainer.innerHTML = `<div class="empty-message">Futbolçu adını yazıb "Axtar" düyməsinə basın.</div>`;
        } else {
          playersContainer.style.display = 'none';
          matchesContainer.style.display = 'block';
          loadMatches(tab);
        }
      }

      // ============================================================
      // 9. HADİSƏ DİNLƏYİCİLƏR
      // ============================================================

      // Tab düymələri
      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          switchTab(tab);
        });
      });

      // Axtarış düyməsi
      searchBtn.addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (currentTab === 'players') {
          searchPlayers(query);
        } else {
          // Matçlar daxilində axtar (sadə filtrləmə)
          if (query.length >= 2) {
            const filtered = allMatches.filter(m =>
              m.homeTeam?.name?.toLowerCase().includes(query.toLowerCase()) ||
              m.awayTeam?.name?.toLowerCase().includes(query.toLowerCase())
            );
            if (filtered.length > 0) {
              renderMatches(filtered, matchesContainer);
            } else {
              showEmpty(matchesContainer, `"${query}" üçün uyğun oyun tapılmadı.`);
            }
          } else {
            // Boşdursa, cari tabı yenidən yüklə
            loadMatches(currentTab);
          }
        }
      });

      // Enter düyməsi
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          searchBtn.click();
        }
      });

      // Modal bağlama
      closeModalBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      // ============================================================
      // 10. TEMA FUNKSİYASI (saytın qalanı ilə uyğun)
      // ============================================================

      function applySavedTheme() {
        const saved = localStorage.getItem('maqaluxTheme') || 'site';
        const btn = document.getElementById('themeToggleBtn');
        document.body.classList.remove('light-theme', 'dark-theme');
        if (saved === 'light') {
          document.body.classList.add('light-theme');
          if (btn) btn.textContent = '🌙';
        } else if (saved === 'dark') {
          document.body.classList.add('dark-theme');
          if (btn) btn.textContent = '🎨';
        } else {
          if (btn) btn.textContent = '☀️';
        }
      }
      window.toggleSiteTheme = function() {
        const current = localStorage.getItem('maqaluxTheme') || 'site';
        const next = current === 'site' ? 'light' : (current === 'light' ? 'dark' : 'site');
        localStorage.setItem('maqaluxTheme', next);
        applySavedTheme();
      };
      applySavedTheme();

      // ============================================================
      // 11. BAŞLATMA – ilk tab "Canlı"
      // ============================================================

      switchTab('live');

    })();
  </script>

</body>
</html>
