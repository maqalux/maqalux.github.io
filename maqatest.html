<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maqalux - Film və Serial Platforması</title>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS DƏYİŞƏNLƏRİ (Mövzu / Theme) */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #e11d48;
            --accent-hover: #be123c;
            --border-color: #334155;
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #e11d48;
            --accent-hover: #be123c;
            --border-color: #e2e8f0;
            --modal-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* YÜKLƏNMƏ EKRANI (PRELOADER) */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* HEADER & NAVIGATION */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            width: 300px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            width: 100%;
            margin-left: 8px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN CONTENT & FILTER */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        /* MOVIE GRID */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .movie-poster {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .movie-info {
            padding: 1rem;
        }

        .movie-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .imdb-rating {
            color: #f59e0b;
            font-weight: bold;
        }

        /* MODAL (PLAYER & AUTH) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            position: relative;
            overflow: hidden;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 1.2rem;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-details {
            padding: 1.5rem;
        }

        /* FOOTER */
        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .search-box {
                display: none;
            }
            .nav-container {
                padding: 0 0.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="spinner"></div>
        <h2>Maqalux Yüklənir...</h2>
    </div>

    <!-- HEADER -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-play"></i> Maqalux
            </a>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="searchInput" placeholder="Film, aktyor və ya kateqoriya axtar...">
            </div>

            <div class="nav-actions">
                <button class="btn-icon" id="themeToggle" title="Mövzunu Dəyiş">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="btn" id="loginBtn">Giriş Şəxsi Kabinet</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="filter-section" id="filterSection">
            <button class="filter-btn active" data-category="all">Hamısı</button>
            <button class="filter-btn" data-category="Aksiya">Aksiya</button>
            <button class="filter-btn" data-category="Dram">Dram</button>
            <button class="filter-btn" data-category="Elmi-Kütləvi">Elmi-Kütləvi</button>
            <button class="filter-btn" data-category="Komediya">Komediya</button>
        </div>

        <div class="movie-grid" id="movieGrid">
            <!-- Filmlər JS vasitəsilə bura render olunacaq -->
        </div>
    </main>

    <!-- VIDEO PLAYER MODAL -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="close-modal" id="closePlayer">&times;</button>
            <div class="video-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
            <div class="modal-details">
                <h2 id="modalTitle">Film Adı</h2>
                <p id="modalMeta" style="color: var(--text-muted); margin: 0.5rem 0;"></p>
                <p id="modalDesc">Film haqqında ətraflı məlumat...</p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Maqalux Platforması. Bütün hüquqlar qorunur.</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // FILM BAZASI (moviesData)
        const moviesData = [
            {
                id: 1,
                title: "Alita: Battle Angel",
                category: "Elmi-Kütləvi",
                year: 2019,
                imdb: 7.3,
                poster: "https://m.media-amazon.com/images/M/MVBMTc2Mzc2OTM5NV5BMl5BanBnXkFtZTgwMTIxNTQ2NzM@._V1_.jpg",
                videoUrl: "https://www.youtube.com/embed/w7pYhpJa900",
                description: "Tərk edilmiş kiber-qız yeni bir bədəndə ayılır və keçmişini xatırlamağa çalışır."
            },
            {
                id: 2,
                title: "Güneşi Gördüm",
                category: "Dram",
                year: 2009,
                imdb: 6.5,
                poster: "https://m.media-amazon.com/images/M/MVBMTY4ODg4OTI4NV5BMl5BanBnXkFtZTcwMjI5Njg3Mg@@._V1_.jpg",
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", 
                description: "Məcburi köçkünlük və ailə faciələrini əks etdirən təsirli bir dram filmi."
            },
            {
                id: 3,
                title: "Spider-Man: No Way Home",
                category: "Aksiya",
                year: 2021,
                imdb: 8.2,
                poster: "https://m.media-amazon.com/images/M/MVBMTWE5M2Y3MDEtYzA3Ni00M2VkLWEwODctODE4NDE4M2MwN2JmXkEyXkFqcGc@._V1_.jpg",
                videoUrl: "https://www.youtube.com/embed/R392x1G3yOk",
                description: "Pitər Parkering şəxsiyyəti ifşa olunur və o, Doktor Strencə müraciət edir."
            },
            {
                id: 4,
                title: "G.O.R.A.",
                category: "Komediya",
                year: 2004,
                imdb: 8.0,
                poster: "https://m.media-amazon.com/images/M/MVBMTI0NTg2NTc5NV5BMl5BanBnXkFtZTcwMTA1NTUyMQ@@._V1_.jpg",
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                description: "Arif adlı xalçaçının yadplanetlilər tərəfindən qaçırılması və kosmosdakı macəraları."
            }
        ];

        // SƏHİFƏ YÜKLƏNDİKDƏ İŞƏ DÜŞƏN ƏSAS MƏNTİQ
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. PRELOADER FUNKSİYASI (Səhifənin donub qalmasını tam həll edən hissə)
            const preloader = document.getElementById('preloader');
            
            function hidePreloader() {
                if (preloader && preloader.style.display !== 'none') {
                    preloader.style.opacity = '0';
                    setTimeout(() => {
                        preloader.style.display = 'none';
                    }, 500);
                }
            }

            // Səhifə tam yükləndikdə loader-i bağla
            window.addEventListener('load', hidePreloader);
            
            // Məcburi Taymer (Fallback): Səhifə gec yüklənsə belə max 1.5 saniyə sonra bağlayır
            setTimeout(hidePreloader, 1500);


            // 2. FILMLƏRIN DOM-A RENDER OLUNMASI
            const movieGrid = document.getElementById('movieGrid');

            function displayMovies(movies) {
                movieGrid.innerHTML = '';
                if (movies.length === 0) {
                    movieGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Hеç bir film tapılmadı.</p>`;
                    return;
                }

                movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/300x450?text=Şəkil+Yoxdur'">
                        <div class="movie-info">
                            <h3 class="movie-title">${movie.title}</h3>
                            <div class="movie-meta">
                                <span>${movie.year} • ${movie.category}</span>
                                <span class="imdb-rating"><i class="fa-solid fa-star"></i> ${movie.imdb}</span>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => openPlayerModal(movie));
                    movieGrid.appendChild(card);
                });
            }

            // İlkin olaraq bütün filmləri göstər
            displayMovies(moviesData);


            // 3. AXTARIŞ (SEARCH) MƏNTİQİ
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = moviesData.filter(movie => 
                    movie.title.toLowerCase().includes(term) || 
                    movie.category.toLowerCase().includes(term)
                );
                displayMovies(filtered);
            });


            // 4. KATEQORİYA FİLTRİ
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const category = btn.getAttribute('data-category');
                    if (category === 'all') {
                        displayMovies(moviesData);
                    } else {
                        const filtered = moviesData.filter(m => m.category === category);
                        displayMovies(filtered);
                    }
                });
            });


            // 5. MOOD / THEME TOGGLE (Qaranlıq / İşıqlı rejim)
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme');
                if (currentTheme === 'light') {
                    document.body.removeAttribute('data-theme');
                    themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i>';
                } else {
                    document.body.setAttribute('data-theme', 'light');
                    themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
                }
            });


            // 6. VIDEO PLAYER MODAL MƏNTİQİ
            const playerModal = document.getElementById('playerModal');
            const closePlayer = document.getElementById('closePlayer');
            const videoIframe = document.getElementById('videoIframe');
            const modalTitle = document.getElementById('modalTitle');
            const modalMeta = document.getElementById('modalMeta');
            const modalDesc = document.getElementById('modalDesc');

            function openPlayerModal(movie) {
                videoIframe.src = movie.videoUrl + "?autoplay=1";
                modalTitle.textContent = movie.title;
                modalMeta.textContent = `${movie.year} | ${movie.category} | IMDb: ${movie.imdb}`;
                modalDesc.textContent = movie.description;
                playerModal.style.display = 'flex';
            }

            function closePlayerModal() {
                playerModal.style.display = 'none';
                videoIframe.src = ''; // Videonu saxlayır
            }

            closePlayer.addEventListener('click', closePlayerModal);
            
            // Modal kənarına tıklandıqda bağlamaq
            window.addEventListener('click', (e) => {
                if (e.target === playerModal) {
                    closePlayerModal();
                }
            });
        });
    </script>
</body>
</html>
